<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>12 - Tipo de Triângulo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
<h2>12 - Tipo de Triângulo</h2>
    <a href="index.html">Voltar</a><br><br>
    <input type="number" id="a" placeholder="Lado A">
    <input type="number" id="b" placeholder="Lado B">
    <input type="number" id="c" placeholder="Lado C">
    <button onclick="ver()">Verificar</button>

    <script>
        function ver() {
            var a = Number(document.getElementById("a").value);
            var b = Number(document.getElementById("b").value);
            var c = Number(document.getElementById("c").value);
            if (a + b > c && a + c > b && b + c > a) {
                if (a == b && b == c) alert("Triângulo Equilátero");
                else if (a == b || a == c || b == c) alert("Triângulo Isósceles");
                else alert("Triângulo Escaleno");
            } else {
                alert("Não forma triângulo");
            }
        }
    </script>
    </div>
</body>
</html>
